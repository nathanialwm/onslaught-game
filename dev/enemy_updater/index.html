<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <title>Enemy Updater</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-header">
        <button class="btn-duplicate" id="btn-duplicate">Duplicate Window</button>
        <h2>Enemies</h2>
        <button class="btn-new" id="btn-new">+ New Enemy</button>
      </div>
      <div class="enemy-list" id="enemy-list"></div>
    </aside>

    <main class="main-panel" id="main-panel">
      <div class="placeholder" id="placeholder">
        Select an enemy or create a new one
      </div>

      <div id="editor" style="display: none;">
        <h2 id="editor-title">New Enemy</h2>
        <div class="form-grid" id="form-grid"></div>
        <div class="form-actions">
          <button class="btn-save" id="btn-save">Save</button>
          <button class="btn-delete hidden" id="btn-delete">Delete</button>
        </div>
        <div class="status-msg" id="status-msg"></div>
      </div>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
